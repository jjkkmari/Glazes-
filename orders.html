<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Your Order | Glazes</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300|Sonsie+One" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Glazes</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="orders.html" class="active">Orders</a></li>
        </ul>
    </nav>

    <main>
        <h2>Review Your Order</h2>
        
        <section class="order-container">
            <div class="order-summary">
                <h3>Shopping Bag</h3>
                <p>Items will be reserved for a limited time.</p>
                <hr>
                <div class="order-item">
                    <span>Oversized Heavyweight Hoodie (Size M)</span>
                    <strong>$110.00</strong>
                </div>
                <hr>
                <div class="order-total">
                    <span><strong>Total (NZD)</strong></span>
                    <strong>$110.00</strong>
                </div>
            </div>

            <div class="checkout-form">
                <h3>Shipping Details</h3>
                <form>
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email Address" required>
                    <input type="text" placeholder="Delivery Address" required>
                    <button type="submit" class="action-btn">Place Order</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
